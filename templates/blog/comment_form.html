{% extends "base.html" %}

{% block title %}Novo Comentário em {{ post.title }}{% endblock %}

{% block content %}
<div class="card" style="max-width: 650px; margin: 0 auto;">
    <div style="margin-bottom: 1rem;">
        <a href="{% url 'post_detail' post.pk %}" style="text-decoration: none; color: var(--secondary);">&larr; Voltar para o post</a>
    </div>

    <h2>Adicionar Comentário</h2>
    <p style="color: var(--text-muted); margin-bottom: 1.5rem;">
        Postagem: <strong>{{ post.title }}</strong>
    </p>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <div style="margin-top: 1.5rem; display: flex; gap: 0.75rem;">
            <button type="submit" class="btn btn-primary">Enviar Comentário</button>
            <a href="{% url 'post_detail' post.pk %}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
